# Sesión 11: kubectl apply -f k8s/julitec.yaml   (Namespace, Secret, Deployments, Services, HPA)
apiVersion: v1
kind: Namespace
metadata: { name: julitec }
---
apiVersion: v1
kind: Secret                      # credenciales fuera de la imagen
metadata: { name: julitec-secret, namespace: julitec }
stringData: { JWT_SECRET_KEY: "cambiar-esta-clave-en-produccion-0123456789" }
---
apiVersion: apps/v1
kind: Deployment                  # Deployment = gestiona réplicas (Pods) y actualizaciones rolling
metadata: { name: backend, namespace: julitec }
spec:
  replicas: 2
  selector: { matchLabels: { app: backend } }
  template:
    metadata: { labels: { app: backend } }
    spec:
      containers:
        - name: backend
          image: ghcr.io/TU_USUARIO/julitec-backend:latest
          ports: [{ containerPort: 5000 }]
          envFrom: [{ secretRef: { name: julitec-secret } }]
          readinessProbe: { httpGet: { path: /api/health, port: 5000 }, initialDelaySeconds: 3 }
          livenessProbe: { httpGet: { path: /api/health, port: 5000 }, initialDelaySeconds: 10 }
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: 500m, memory: 256Mi } }
---
apiVersion: v1
kind: Service                     # DNS interno "backend": lo usa nginx (proxy_pass http://backend:5000)
metadata: { name: backend, namespace: julitec }
spec: { selector: { app: backend }, ports: [{ port: 5000, targetPort: 5000 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: frontend, namespace: julitec }
spec:
  replicas: 2
  selector: { matchLabels: { app: frontend } }
  template:
    metadata: { labels: { app: frontend } }
    spec:
      containers:
        - name: frontend
          image: ghcr.io/TU_USUARIO/julitec-frontend:latest
          ports: [{ containerPort: 80 }]
          readinessProbe: { httpGet: { path: /, port: 80 } }
          resources: { requests: { cpu: 50m, memory: 32Mi }, limits: { cpu: 200m, memory: 128Mi } }
---
apiVersion: v1
kind: Service                     # NodePort: expone la web en http://localhost:30080 (minikube/Docker Desktop)
metadata: { name: frontend, namespace: julitec }
spec: { type: NodePort, selector: { app: frontend }, ports: [{ port: 80, targetPort: 80, nodePort: 30080 }] }
---
apiVersion: autoscaling/v2        # escala el backend de 2 a 5 pods según CPU
kind: HorizontalPodAutoscaler
metadata: { name: backend, namespace: julitec }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: backend }
  minReplicas: 2
  maxReplicas: 5
  metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } } }]
